name: monitor_parlamentar
version: "0.0.1"
config-version: 2
profile: monitor_parlamentar

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # Fontes cujos adaptadores alimentam os marts (ADR-003, seção 4).
  fontes_ativas: ["camara_api"]

models:
  monitor_parlamentar:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table
seeds:
  monitor_parlamentar:
    mapa_tipos_proposicao:
      +column_types:
        sigla_tipo: varchar
        categoria: varchar
    mapa_tipos_voto:
      +column_types:
        tipo_voto: varchar
        voto: varchar
