version: 2

sources:
  - name: camara_api
    description: "Arquivos brutos gravados pelo `monitor ingest` (fonte camara_api)."
    config:
      meta:
        external_location: "{{ env_var('MONITOR_DIR_BRUTO', '../data/bruto') }}/camara_api/{name}.parquet"
    tables:
      - name: deputados
        description: "Deputados em exercício, um por linha, validados pelo modelo DeputadoApi."
      - name: proposicoes
        description: "Proposições apresentadas, um arquivo por mês (proposicoes_AAAA-MM.parquet)."
        config:
          meta:
            external_location: "{{ env_var('MONITOR_DIR_BRUTO', '../data/bruto') }}/camara_api/proposicoes_*.parquet"
      - name: autores
        description: "Autores de cada proposição, um arquivo por mês (autores_AAAA-MM.parquet)."
        config:
          meta:
            external_location: "{{ env_var('MONITOR_DIR_BRUTO', '../data/bruto') }}/camara_api/autores_*.parquet"
      - name: votacoes
        description: "Votações do Plenário, um arquivo por mês (votacoes_AAAA-MM.parquet)."
        config:
          meta:
            external_location: "{{ env_var('MONITOR_DIR_BRUTO', '../data/bruto') }}/camara_api/votacoes_*.parquet"
      - name: votos
        description: "Votos de cada votação, de todas as UFs, um arquivo por mês (votos_AAAA-MM.parquet)."
        config:
          meta:
            external_location: "{{ env_var('MONITOR_DIR_BRUTO', '../data/bruto') }}/camara_api/votos_*.parquet"
      - name: afetadas
        description: "Proposições afetadas pelas votações nominais, um arquivo por mês (afetadas_AAAA-MM.parquet)."
        config:
          meta:
            external_location: "{{ env_var('MONITOR_DIR_BRUTO', '../data/bruto') }}/camara_api/afetadas_*.parquet"
