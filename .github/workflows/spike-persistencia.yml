name: Spike persistência

on:
  push:
    branches: ["spike/**"]

permissions:
  contents: write

jobs:
  experimento:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Enviar o Parquet para a release
        run: |
          gh release upload dados-brutos \
            tests/fixtures/bruto/camara_api/deputados.parquet --clobber

      - name: Baixar de volta, numa pasta vazia
        run: |
          mkdir baixado
          gh release download dados-brutos --pattern deputados.parquet --dir baixado
          ls -la baixado
